# ============================================================================
# blogme — Nginx 配置示例（便于服务端部署）
#
# 使用方式：
#   1. 将本文件内容并入 server { } 块（或与 server 块 include 引用）。
#   2. 把 web 根目录 root 指向 blogme 的 public/ 目录。
#   3. 修改下方 fastcgi_pass 为你实际的 PHP-FPM 监听地址。
#   4. 静态资源优先由 Nginx 直接服务；未命中的动态请求统一回退到
#      index.php，由 PHP 端（Blogme\Core\Request）解析真实路由，
#      因此本配置不依赖任何额外的「路由 rewrite」规则。
# ============================================================================

# 静态资源压缩（放在 server 块；若你统一放到 http 块也可以）
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# 若 Nginx 已安装 brotli 模块，可额外启用：
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types
#     text/plain
#     text/css
#     text/javascript
#     application/javascript
#     application/json
#     application/xml
#     application/rss+xml
#     image/svg+xml;

# ----------------------------------------------------------------------------
# 1) 动态请求：核心 rewrite
#    物理文件优先 -> 目录 -> 回退到 index.php（PHP 负责解析路由）
# ----------------------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 避免 /admin 被当成物理目录 public/admin/ 触发 301 -> /admin/ -> 403
location = /admin/ {
    return 301 /admin;
}

# 浏览器默认请求，避免无意义 404
location = /favicon.ico {
    try_files /themes/default/assets/favicon.png =404;
    access_log off;
}

# ----------------------------------------------------------------------------
# 2) 静态资源：均位于 public/ 下的物理目录，Nginx 直接服务并加缓存头
# ----------------------------------------------------------------------------

# 上传资源（物理文件在 public/uploads）
location ^~ /uploads/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# 主题资源（物理文件在 public/themes）
location ^~ /themes/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# 后台静态资源（物理文件在 public/admin/assets）
location ^~ /admin/assets/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# 兼容旧主题中的 /assets/* 路径：交给应用层按当前主题映射，
# 物理文件缺失时回退 index.php（Blogme 在 PHP 端按主题解析）。
location ^~ /assets/ {
    try_files $uri /index.php?$query_string;
}

# ----------------------------------------------------------------------------
# 3) PHP-FPM 转发
# ----------------------------------------------------------------------------
location ~ \.php$ {
    # 按实际环境选择 unix socket 或 tcp
    # fastcgi_pass   unix:/run/php/php-fpm.sock;
    fastcgi_pass   127.0.0.1:9000;

    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;
    fastcgi_hide_header X-Powered-By;
    fastcgi_intercept_errors on;
}
